name: book-marketplace

x-app-health: &app-health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    image: book-marketplace-auth:local
    environment:
      PORT: "8001"
      INSTANCE_NAME: auth
      SERVICE_HOST: auth
      CONSUL_HTTP_ADDR: http://consul:8500
      SECRET_KEY: ${SECRET_KEY:?Create .env with a random SECRET_KEY}
    networks: [marketplace]
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
    stop_grace_period: 20s

  catalog-1:
    build:
      context: .
      dockerfile: catalog_service/Dockerfile
    image: book-marketplace-catalog:local
    container_name: catalog-1
    environment:
      PORT: "8002"
      INSTANCE_NAME: catalog-1
      SERVICE_HOST: catalog-1
      CONSUL_HTTP_ADDR: http://consul:8500
    networks: [marketplace]
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/', timeout=2)"]
    stop_grace_period: 20s

  catalog-2:
    image: book-marketplace-catalog:local
    pull_policy: never
    container_name: catalog-2
    environment:
      PORT: "8003"
      INSTANCE_NAME: catalog-2
      SERVICE_HOST: catalog-2
      CONSUL_HTTP_ADDR: http://consul:8500
    networks: [marketplace]
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/', timeout=2)"]
    stop_grace_period: 20s

  order:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    image: book-marketplace-order:local
    environment:
      PORT: "8004"
      INSTANCE_NAME: order
      SERVICE_HOST: order
      CONSUL_HTTP_ADDR: http://consul:8500
    networks: [marketplace]
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]
    stop_grace_period: 20s

  graphql:
    build:
      context: .
      dockerfile: graphql_gateway/Dockerfile
    image: book-marketplace-graphql:local
    environment:
      PORT: "8005"
      INSTANCE_NAME: graphql
      SERVICE_HOST: graphql
      CONSUL_HTTP_ADDR: http://consul:8500
      ORDER_SERVICE_URL: http://order:8004
      CATALOG_SERVICE_URL: http://nginx
    networks: [marketplace]
    healthcheck:
      <<: *app-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=2)"]
    stop_grace_period: 20s

  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8080:80"]
    networks: [marketplace]
    depends_on:
      auth:
        condition: service_healthy
      catalog-1:
        condition: service_healthy
      catalog-2:
        condition: service_healthy
      order:
        condition: service_healthy
      graphql:
        condition: service_healthy
    healthcheck:
      <<: *app-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]

  consul:
    image: hashicorp/consul:1.22
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    ports: ["127.0.0.1:8500:8500"]
    networks: [marketplace]
    healthcheck:
      <<: *app-health
      test: ["CMD", "consul", "members"]

networks:
  marketplace:
    driver: bridge
