# Static upstream membership; Consul is a separate discovery/health registry.
worker_processes 1;
events { worker_connections 1024; }

http {
    # Docker DNS refresh allows recreated containers to change IP addresses.
    resolver 127.0.0.11 valid=5s ipv6=off;
    log_format upstream_log '$remote_addr "$request" $status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /var/log/nginx/access.log upstream_log;

    upstream auth_backend {
        zone auth_backend 64k;
        server auth:8001 resolve;
    }
    upstream catalog_backend {
        zone catalog_backend 64k;
        # Default algorithm: round-robin, equal weights.
        server catalog-1:8002 resolve max_fails=1 fail_timeout=5s;
        server catalog-2:8003 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        location = / {
            default_type application/json;
            return 200 '{"service":"book-marketplace-gateway","status":"healthy"}';
        }
        location = /auth { return 308 /auth/; }
        location = /catalog { return 308 /catalog/; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        location /auth/ {
            proxy_pass http://auth_backend/;
        }
        location /catalog/ {
            proxy_pass http://catalog_backend/;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 6s;
            # Do not enable non_idempotent retries: a sent POST may have created data.
        }
    }
}
